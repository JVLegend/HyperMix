<text x="36" y="780" class="subtitle">Intervals are not standardized. Compare direction and zero crossing row by row, not line length across metrics.</text>
<text x="36" y="810" class="subtitle">T7b and T12 loss/error contrasts are sign-inverted only for this directional display.</text>
